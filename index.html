<head>
<meta charset="UTF-8">

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 체크리스트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: linear-gradient(to bottom, #e3f2fd, #f8fafc);
    margin: 0;
    padding: 40px 20px 100px 20px;
    color: #333;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .container { max-width: 800px; margin: 0 auto; position: relative; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-left h1 { font-size: 24px; margin: 0; }
  .header-stats { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; background: white; padding: 6px 14px; border-radius: 20px; border: 1px solid #e2e8f0; }
  .stat-badge { display: flex; align-items: center; gap: 4px; }
  .completed-badge { color: #059669; }
  .active-badge { color: #2563eb; }
  .stat-divider { color: #cbd5e1; }
  .header-buttons { display: flex; gap: 10px; }
  .btn { padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
  .btn:hover { background: #f8fafc; }
  
  .filters { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-group { display: flex; background: white; border-radius: 8px; padding: 4px; border: 1px solid #ddd; }
  .filter-btn { padding: 8px 16px; border: none; background: none; cursor: pointer; border-radius: 6px; color: #666; font-weight: 500;}
  .filter-btn.active { background: #f1f5f9; color: #1a1a1a; font-weight: bold; }
  
  .date-filter-group { display: flex; align-items: center; gap: 6px; }
  .date-input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; color: #333; outline: none; cursor: pointer; }
  .date-input:focus { border-color: #1a1a1a; }
  
  .task-section { margin-bottom: 24px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .tag-major { background: #f3e8ff; color: #7e22ce; padding: 4px 12px; border-radius: 16px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
  .tag-daily { background: #e0f2fe; color: #0284c7; padding: 4px 12px; border-radius: 16px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
  .count-badge { background: white; border-radius: 50%; padding: 0 6px; margin-left: 4px; font-size: 12px; }
  
  .task-list { background: white; border-radius: 12px; border: 1px solid #eee; padding: 8px; min-height: 60px; }
  .task-item { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 12px; border-bottom: 1px solid #f8f9fa; animation: fadeIn 0.3s ease; }
  .task-item:last-child { border-bottom: none; }
  .task-item.dragging { opacity: 0.5; }
  .task-left { display: flex; align-items: flex-start; gap: 12px; width: 100%; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .task-checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ddd; background: white; color: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; user-select: none; flex-shrink: 0; margin-top: 2px; }
  .task-checkbox.checked { border-color: #1a1a1a; background: #1a1a1a; color: white; }
  
  .task-content { flex: 1; }
  .task-content h3 { margin: 0 0 6px 0; font-size: 16px; color: #333; transition: color 0.2s; }
  .task-content h3.completed { text-decoration: line-through; color: #aaa; }
  
  /* 💡 부가 설명 스타일 */
  .task-desc { margin: 0 0 8px 0; font-size: 13.5px; color: #64748b; line-height: 1.5; white-space: pre-wrap; }
  .task-desc.completed { color: #cbd5e1; text-decoration: line-through; }
  
  .task-date { margin: 0; font-size: 12px; color: #aaa; }
  
  .task-actions { display: flex; gap: 4px; }
  .task-badge { background: #f1f5f9; padding: 6px 10px; border-radius: 6px; font-size: 12px; color: #666; cursor: pointer; border: none; transition: 0.2s; white-space: nowrap; }
  .task-badge:hover { background: #e2e8f0; color: #333; }
  .task-badge.delete-btn:hover { background: #fee2e2; color: #ef4444; }
  .empty-msg { text-align: center; color: #999; padding: 20px; font-size: 14px; }

  /* 하단 채팅창 스타일 */
  .chat-input-wrapper { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 800px; background: white; padding: 12px 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; gap: 10px; border: 1px solid #eee; z-index: 100; }
  .task-type-select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f8fafc; color: #333; font-weight: 500; outline: none; cursor: pointer; }
  .task-input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
  .task-input:focus { border-color: #1a1a1a; }
  .task-submit-btn { background: #1a1a1a; color: white; border: none; padding: 0 24px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
  .task-submit-btn:hover { background: #333; }

  /* 💡 새롭게 추가된 팝업(모달) 스타일 */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s; }
  .modal-content { background: white; width: 90%; max-width: 450px; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; gap: 16px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; }
  .modal-header h2 { margin: 0; font-size: 18px; color: #1a1a1a; }
  .modal-close-btn { background: none; border: none; font-size: 20px; color: #999; cursor: pointer; }
  .modal-close-btn:hover { color: #333; }
  
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 13px; font-weight: bold; color: #64748b; }
  .modal-input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; font-family: inherit; transition: 0.2s; }
  .modal-input:focus { border-color: #1a1a1a; }
  .modal-textarea { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; resize: vertical; min-height: 100px; transition: 0.2s; }
  .modal-textarea:focus { border-color: #1a1a1a; }
  
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .btn-cancel { padding: 10px 20px; border: 1px solid #ddd; background: white; color: #666; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-save { padding: 10px 24px; border: none; background: #1a1a1a; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-cancel:hover { background: #f8fafc; }
  .btn-save:hover { background: #333; }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="header-left">
      <h1>업무 체크리스트</h1>
      <div class="header-stats">
        <span class="stat-badge completed-badge">완료 <span id="top-completed">0</span></span>
        <span class="stat-divider">/</span>
        <span class="stat-badge active-badge">진행중 <span id="top-active">0</span></span>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn" onclick="exportToExcel()">📊 엑셀로 저장</button>
      <input type="file" id="excel-file-input" style="display: none;" accept=".xlsx, .xls" onchange="importFromExcel(event)">
      <button class="btn" onclick="document.getElementById('excel-file-input').click()">📂 엑셀 불러오기</button>
    </div>
  </header>

  <div class="filters">
    <div class="filter-group" id="filter-container">
      <button class="filter-btn" onclick="setFilter('all')">전체</button>
      <button class="filter-btn active" onclick="setFilter('active')">진행 중</button>
      <button class="filter-btn" onclick="setFilter('completed')">완료됨</button>
    </div>
    <div class="date-filter-group">
      <input type="date" id="date-filter" class="date-input" onchange="filterByDate(this.value)">
      <button class="btn" style="padding: 8px 12px; font-size: 14px;" onclick="clearDateFilter()">🔄 초기화</button>
    </div>
  </div>

  <div class="task-section">
    <div class="section-header">
      <div class="tag-major">⭐ 주요업무 <span class="count-badge" id="major-count">0</span></div>
    </div>
    <div class="task-list" id="major-list" ondragover="allowDrop(event)" ondrop="drop(event, 'major')"></div>
  </div>

  <div class="task-section">
    <div class="section-header">
      <div class="tag-daily">📋 일일업무 <span class="count-badge" id="daily-count">0</span></div>
    </div>
    <div class="task-list" id="daily-list" ondragover="allowDrop(event)" ondrop="drop(event, 'daily')"></div>
  </div>
</div>

<div class="chat-input-wrapper">
  <select class="task-type-select" id="chat-task-type">
    <option value="daily">일일업무</option>
    <option value="major">주요업무</option>
  </select>
  <input type="text" class="task-input" id="chat-task-input" placeholder="새로운 업무를 입력하고 엔터를 누르세요..." onkeypress="handleKeyPress(event)">
  <button class="task-submit-btn" onclick="addChatTask()">등록</button>
</div>

<div id="edit-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>업무 내용 수정</h2>
      <button class="modal-close-btn" onclick="closeEditModal()">✕</button>
    </div>
    <div class="input-group">
      <label>업무 제목 (필수)</label>
      <input type="text" id="modal-title-input" class="modal-input" placeholder="업무 내용을 입력하세요">
    </div>
    <div class="input-group">
      <label>부가 설명 (선택)</label>
      <textarea id="modal-desc-input" class="modal-textarea" placeholder="상세한 내용이나 참고사항을 적어주세요..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="btn-save" onclick="saveModalEdit()">저장</button>
    </div>
  </div>
</div>

<script>
  function getTodayDate() {
    const today = new Date();
    const month = today.getMonth() + 1;
    const date = today.getDate();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const day = days[today.getDay()];
    const hours = String(today.getHours()).padStart(2, '0');
    const minutes = String(today.getMinutes()).padStart(2, '0');
    return `${month}월 ${date}일 (${day}) · ${hours}:${minutes}`;
  }

  function getRawDate() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  }

  const defaultTasks = [
    { id: 1, text: '명일 공정표 작성', description: '현장 소장님 컨펌 후 엑셀 파일 공유할 것', date: getTodayDate(), rawDate: getRawDate(), isCompleted: true, type: 'major' },
    { id: 2, text: '자재 물량 산출 검토', description: '', date: getTodayDate(), rawDate: getRawDate(), isCompleted: false, type: 'daily' }
  ];

  const savedTasks = localStorage.getItem('myChecklistTasks');
  let tasks = savedTasks ? JSON.parse(savedTasks) : defaultTasks;
  
  tasks = tasks.map(t => {
    if(!t.rawDate) t.rawDate = getRawDate();
    if(t.description === undefined) t.description = ""; // 💡 기존 데이터에 description이 없으면 빈칸 처리
    return t;
  });

  let currentFilter = 'active'; 
  let selectedDate = ''; 
  let draggedTaskId = null; 
  let currentEditingId = null; // 💡 현재 팝업에서 수정 중인 업무 ID

  function saveTasksToStorage() {
    localStorage.setItem('myChecklistTasks', JSON.stringify(tasks));
  }

  // 엑셀 저장 시 '부가 설명' 포함
  function exportToExcel() {
    if (tasks.length === 0) {
      alert("저장할 업무가 없습니다.");
      return;
    }

    const excelData = tasks.map(task => ({
      "업무 구분": task.type === 'major' ? '주요업무' : '일일업무',
      "업무 내용": task.text,
      "부가 설명": task.description || "", // 💡 엑셀 열 추가
      "등록 일시": task.date,
      "상태": task.isCompleted ? '완료됨' : '진행 중',
      "필터용 날짜": task.rawDate 
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "업무 체크리스트");

    const today = new Date();
    const dateString = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2,'0')}${today.getDate().toString().padStart(2,'0')}`;
    XLSX.writeFile(workbook, `업무체크리스트_${dateString}.xlsx`);
  }

  // 엑셀 불러올 때 '부가 설명' 인식
  function importFromExcel(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet);

        if (json.length > 0 && confirm("기존 메모가 모두 지워지고 엑셀 파일 내용으로 덮어씌워집니다. 진행하시겠습니까?")) {
          tasks = json.map((row, index) => ({
            id: Date.now() + index, 
            text: row["업무 내용"] || "내용 없음",
            description: row["부가 설명"] || "", // 💡 엑셀에서 읽어오기
            date: row["등록 일시"] || getTodayDate(),
            rawDate: row["필터용 날짜"] || getRawDate(), 
            isCompleted: row["상태"] === '완료됨',
            type: row["업무 구분"] === '주요업무' ? 'major' : 'daily'
          }));

          saveTasksToStorage();
          renderTasks();
          alert("엑셀 파일이 성공적으로 불러와졌습니다!");
        }
      } catch (err) {
        alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
      }
    };
    reader.readAsArrayBuffer(file);
    event.target.value = ''; 
  }

  function filterByDate(dateVal) {
    selectedDate = dateVal;
    renderTasks();
  }

  function clearDateFilter() {
    document.getElementById('date-filter').value = '';
    selectedDate = '';
    renderTasks();
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') addChatTask();
  }

  function addChatTask() {
    const inputEl = document.getElementById('chat-task-input');
    const typeSelectEl = document.getElementById('chat-task-type');
    const taskText = inputEl.value.trim();

    if (!taskText) return;

    const newTask = {
      id: Date.now(),
      text: taskText,
      description: "", // 처음 등록할 땐 빈칸
      date: getTodayDate(),
      rawDate: getRawDate(),
      isCompleted: false,
      type: typeSelectEl.value
    };

    tasks.push(newTask);
    saveTasksToStorage(); 
    inputEl.value = '';
    
    if(selectedDate && selectedDate !== newTask.rawDate) clearDateFilter();
    
    if(currentFilter === 'completed') setFilter('active');
    else renderTasks();
    
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.isCompleted = !task.isCompleted;
      saveTasksToStorage(); 
      renderTasks();
    }
  }

  function deleteTask(id) {
    if(confirm('이 업무를 삭제하시겠습니까?')) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasksToStorage(); 
      renderTasks();
    }
  }

  // --- 💡 팝업 모달 제어 함수 ---
  function openEditModal(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    currentEditingId = id;
    document.getElementById('modal-title-input').value = task.text;
    document.getElementById('modal-desc-input').value = task.description || "";
    
    // 모달 보이기
    document.getElementById('edit-modal').style.display = 'flex';
    document.getElementById('modal-title-input').focus();
  }

  function closeEditModal() {
    currentEditingId = null;
    document.getElementById('edit-modal').style.display = 'none';
  }

  function saveModalEdit() {
    if (!currentEditingId) return;

    const newTitle = document.getElementById('modal-title-input').value.trim();
    const newDesc = document.getElementById('modal-desc-input').value.trim();

    if (!newTitle) {
      alert("업무 제목은 필수입니다.");
      return;
    }

    const task = tasks.find(t => t.id === currentEditingId);
    if (task) {
      task.text = newTitle;
      task.description = newDesc;
      saveTasksToStorage();
      renderTasks();
    }
    closeEditModal();
  }
  // ------------------------------

  function setFilter(filterType) {
    currentFilter = filterType;
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    
    if(filterType === 'all') buttons[0].classList.add('active');
    if(filterType === 'active') buttons[1].classList.add('active');
    if(filterType === 'completed') buttons[2].classList.add('active');
    
    renderTasks();
  }

  function dragStart(event, id) {
    draggedTaskId = id;
    setTimeout(() => event.target.classList.add('dragging'), 0);
  }

  function dragEnd(event) {
    event.target.classList.remove('dragging');
  }

  function allowDrop(event) {
    event.preventDefault();
  }

  function drop(event, targetType) {
    event.preventDefault();
    const task = tasks.find(t => t.id === draggedTaskId);
    if (task && task.type !== targetType) {
      task.type = targetType;
      saveTasksToStorage(); 
      renderTasks();
    }
  }

  function renderTasks() {
    const majorListEl = document.getElementById('major-list');
    const dailyListEl = document.getElementById('daily-list');
    
    majorListEl.innerHTML = '';
    dailyListEl.innerHTML = '';

    let majorCount = 0; let dailyCount = 0; let completedCount = 0;

    tasks.forEach(task => {
      if (selectedDate && task.rawDate !== selectedDate) return;
      if (task.isCompleted) completedCount++;
      if (currentFilter === 'active' && task.isCompleted) return;
      if (currentFilter === 'completed' && !task.isCompleted) return;
      if (task.type === 'major') majorCount++;
      if (task.type === 'daily') dailyCount++;

      // 💡 부가 설명이 있으면 보여주고, 없으면 안 보여주는 처리
      const descHTML = task.description 
        ? `<p class="task-desc ${task.isCompleted ? 'completed' : ''}">${task.description}</p>` 
        : '';

      const taskHTML = `
        <div class="task-item" data-id="${task.id}" draggable="true" ondragstart="dragStart(event, ${task.id})" ondragend="dragEnd(event)">
          <div class="task-left">
            <div class="task-checkbox ${task.isCompleted ? 'checked' : ''}" onclick="toggleTask(${task.id})">
              ${task.isCompleted ? '✔' : ''}
            </div>
            <div class="task-content">
              <h3 class="${task.isCompleted ? 'completed' : ''}">${task.text}</h3>
              ${descHTML}
              <p class="task-date">📅 ${task.date}</p>
            </div>
          </div>
          <div class="task-actions">
            <button class="task-badge edit-btn" onclick="openEditModal(${task.id})">수정</button>
            <button class="task-badge delete-btn" onclick="deleteTask(${task.id})">삭제</button>
          </div>
        </div>
      `;

      if (task.type === 'major') majorListEl.innerHTML += taskHTML;
      else dailyListEl.innerHTML += taskHTML;
    });

    if (majorListEl.innerHTML === '') majorListEl.innerHTML = '<div class="empty-msg">해당 날짜에 등록된 업무가 없습니다.</div>';
    if (dailyListEl.innerHTML === '') dailyListEl.innerHTML = '<div class="empty-msg">해당 날짜에 등록된 업무가 없습니다.</div>';

    document.getElementById('major-count').innerText = majorCount;
    document.getElementById('daily-count').innerText = dailyCount;
    document.getElementById('top-completed').innerText = completedCount;
    document.getElementById('top-active').innerText = (majorCount + dailyCount) - completedCount;
  }

  // 바탕화면(모달 바깥) 클릭 시 팝업 닫기
  window.onclick = function(event) {
    const modal = document.getElementById('edit-modal');
    if (event.target === modal) {
      closeEditModal();
    }
  }

  renderTasks();
</script>

</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body {

  .task-section { margin-bottom: 24px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .task-checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ddd; background: white; color: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; user-select: none; flex-shrink: 0; margin-top: 2px; }

  .task-content { flex: 1; }

  .task-date { margin: 0; font-size: 12px; color: #aaa; }
  
  .task-actions { display: flex; gap: 4px; }
  .task-badge { background: #f1f5f9; padding: 6px 10px; border-radius: 6px; font-size: 12px; color: #666; cursor: pointer; border: none; transition: 0.2s; white-space: nowrap; }
  .task-badge:hover { background: #e2e8f0; color: #333; }
  .task-badge.delete-btn:hover { background: #fee2e2; color: #ef4444; }
  .empty-msg { text-align: center; color: #999; padding: 20px; font-size: 14px; }

  /* 하단 채팅창 스타일 */
  .chat-input-wrapper { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 800px; background: white; padding: 12px 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; gap: 10px; border: 1px solid #eee; z-index: 100; }
  .task-type-select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #f8fafc; color: #333; font-weight: 500; outline: none; cursor: pointer; }
  .task-input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }

  /* 💡 새롭게 추가된 팝업(모달) 스타일 */

  .modal-content { background: white; width: 90%; max-width: 450px; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; gap: 16px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; }

  .modal-close-btn { background: none; border: none; font-size: 20px; color: #999; cursor: pointer; }
  .modal-close-btn:hover { color: #333; }
  
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 13px; font-weight: bold; color: #64748b; }
  .modal-input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; font-family: inherit; transition: 0.2s; }
  .modal-input:focus { border-color: #1a1a1a; }
  .modal-textarea { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; resize: vertical; min-height: 100px; transition: 0.2s; }
  .modal-textarea:focus { border-color: #1a1a1a; }
  
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .btn-cancel { padding: 10px 20px; border: 1px solid #ddd; background: white; color: #666; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-save { padding: 10px 24px; border: none; background: #1a1a1a; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .btn-cancel:hover { background: #f8fafc; }
  .btn-save:hover { background: #333; }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="header-left">
      <h1>업무 체크리스트</h1>
      <div class="header-stats">
        <span class="stat-badge completed-badge">완료 <span id="top-completed">0</span></span>
        <span class="stat-divider">/</span>
        <span class="stat-badge active-badge">진행중 <span id="top-active">0</span></span>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn" onclick="exportToExcel()">📊 엑셀로 저장</button>
      <input type="file" id="excel-file-input" style="display: none;" accept=".xlsx, .xls" onchange="importFromExcel(event)">
      <button class="btn" onclick="document.getElementById('excel-file-input').click()">📂 엑셀 불러오기</button>
    </div>
  </header>

  <div class="filters">
    <div class="filter-group" id="filter-container">
      <button class="filter-btn" onclick="setFilter('all')">전체</button>
      <button class="filter-btn active" onclick="setFilter('active')">진행 중</button>
      <button class="filter-btn" onclick="setFilter('completed')">완료됨</button>
    </div>
    <div class="date-filter-group">
      <input type="date" id="date-filter" class="date-input" onchange="filterByDate(this.value)">
      <button class="btn" style="padding: 8px 12px; font-size: 14px;" onclick="clearDateFilter()">🔄 초기화</button>
    </div>
  </div>

  <div class="task-section">
    <div class="section-header">
      <div class="tag-major">⭐ 주요업무 <span class="count-badge" id="major-count">0</span></div>
    </div>
    <div class="task-list" id="major-list" ondragover="allowDrop(event)" ondrop="drop(event, 'major')"></div>
  </div>

  <div class="task-section">
    <div class="section-header">
      <div class="tag-daily">📋 일일업무 <span class="count-badge" id="daily-count">0</span></div>
    </div>
    <div class="task-list" id="daily-list" ondragover="allowDrop(event)" ondrop="drop(event, 'daily')"></div>
  </div>
</div>

<div class="chat-input-wrapper">
  <select class="task-type-select" id="chat-task-type">
    <option value="daily">일일업무</option>
    <option value="major">주요업무</option>
  </select>
  <input type="text" class="task-input" id="chat-task-input" placeholder="새로운 업무를 입력하고 엔터를 누르세요..." onkeypress="handleKeyPress(event)">
  <button class="task-submit-btn" onclick="addChatTask()">등록</button>
</div>

<div id="edit-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>업무 내용 수정</h2>
      <button class="modal-close-btn" onclick="closeEditModal()">✕</button>
    </div>
    <div class="input-group">
      <label>업무 제목 (필수)</label>
      <input type="text" id="modal-title-input" class="modal-input" placeholder="업무 내용을 입력하세요">
    </div>
    <div class="input-group">
      <label>부가 설명 (선택)</label>
      <textarea id="modal-desc-input" class="modal-textarea" placeholder="상세한 내용이나 참고사항을 적어주세요..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="btn-save" onclick="saveModalEdit()">저장</button>
    </div>
  </div>
</div>

<script>
  function getTodayDate() {
    const today = new Date();
    const month = today.getMonth() + 1;
    const date = today.getDate();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const day = days[today.getDay()];
    const hours = String(today.getHours()).padStart(2, '0');
    const minutes = String(today.getMinutes()).padStart(2, '0');
    return `${month}월 ${date}일 (${day}) · ${hours}:${minutes}`;
  }

  function getRawDate() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  }

  const defaultTasks = [
    { id: 1, text: '명일 공정표 작성', description: '현장 소장님 컨펌 후 엑셀 파일 공유할 것', date: getTodayDate(), rawDate: getRawDate(), isCompleted: true, type: 'major' },
    { id: 2, text: '자재 물량 산출 검토', description: '', date: getTodayDate(), rawDate: getRawDate(), isCompleted: false, type: 'daily' }
  ];

  const savedTasks = localStorage.getItem('myChecklistTasks');
  let tasks = savedTasks ? JSON.parse(savedTasks) : defaultTasks;
  
  tasks = tasks.map(t => {
    if(!t.rawDate) t.rawDate = getRawDate();
    if(t.description === undefined) t.description = ""; // 💡 기존 데이터에 description이 없으면 빈칸 처리
    return t;
  });

  let currentFilter = 'active'; 
  let selectedDate = ''; 
  let draggedTaskId = null; 
  let currentEditingId = null; // 💡 현재 팝업에서 수정 중인 업무 ID

  function saveTasksToStorage() {
    localStorage.setItem('myChecklistTasks', JSON.stringify(tasks));
  }

  // 엑셀 저장 시 '부가 설명' 포함
  function exportToExcel() {
    if (tasks.length === 0) {
      alert("저장할 업무가 없습니다.");
      return;
    }

    const excelData = tasks.map(task => ({
      "업무 구분": task.type === 'major' ? '주요업무' : '일일업무',
      "업무 내용": task.text,
      "부가 설명": task.description || "", // 💡 엑셀 열 추가
      "등록 일시": task.date,
      "상태": task.isCompleted ? '완료됨' : '진행 중',
      "필터용 날짜": task.rawDate 
    }));

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "업무 체크리스트");

    const today = new Date();
    const dateString = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2,'0')}${today.getDate().toString().padStart(2,'0')}`;
    XLSX.writeFile(workbook, `업무체크리스트_${dateString}.xlsx`);
  }

  // 엑셀 불러올 때 '부가 설명' 인식
  function importFromExcel(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(worksheet);

        if (json.length > 0 && confirm("기존 메모가 모두 지워지고 엑셀 파일 내용으로 덮어씌워집니다. 진행하시겠습니까?")) {
          tasks = json.map((row, index) => ({
            id: Date.now() + index, 
            text: row["업무 내용"] || "내용 없음",
            description: row["부가 설명"] || "", // 💡 엑셀에서 읽어오기
            date: row["등록 일시"] || getTodayDate(),
            rawDate: row["필터용 날짜"] || getRawDate(), 
            isCompleted: row["상태"] === '완료됨',
            type: row["업무 구분"] === '주요업무' ? 'major' : 'daily'
          }));

          saveTasksToStorage();
          renderTasks();
          alert("엑셀 파일이 성공적으로 불러와졌습니다!");
        }
      } catch (err) {
        alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
      }
    };
    reader.readAsArrayBuffer(file);
    event.target.value = ''; 
  }

  function filterByDate(dateVal) {
    selectedDate = dateVal;
    renderTasks();
  }

  function clearDateFilter() {
    document.getElementById('date-filter').value = '';
    selectedDate = '';
    renderTasks();
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') addChatTask();
  }

  function addChatTask() {
    const inputEl = document.getElementById('chat-task-input');
    const typeSelectEl = document.getElementById('chat-task-type');
    const taskText = inputEl.value.trim();

    if (!taskText) return;

    const newTask = {
      id: Date.now(),
      text: taskText,
      description: "", // 처음 등록할 땐 빈칸
      date: getTodayDate(),
      rawDate: getRawDate(),
      isCompleted: false,
      type: typeSelectEl.value
    };

    tasks.push(newTask);
    saveTasksToStorage(); 
    inputEl.value = '';
    
    if(selectedDate && selectedDate !== newTask.rawDate) clearDateFilter();
    
    if(currentFilter === 'completed') setFilter('active');
    else renderTasks();
    
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.isCompleted = !task.isCompleted;
      saveTasksToStorage(); 
      renderTasks();
    }
  }

  function deleteTask(id) {
    if(confirm('이 업무를 삭제하시겠습니까?')) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasksToStorage(); 
      renderTasks();
    }
  }

  // --- 💡 팝업 모달 제어 함수 ---
  function openEditModal(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    currentEditingId = id;
    document.getElementById('modal-title-input').value = task.text;
    document.getElementById('modal-desc-input').value = task.description || "";
    
    // 모달 보이기
    document.getElementById('edit-modal').style.display = 'flex';
    document.getElementById('modal-title-input').focus();
  }

  function closeEditModal() {
    currentEditingId = null;
    document.getElementById('edit-modal').style.display = 'none';
  }

  function saveModalEdit() {
    if (!currentEditingId) return;

    const newTitle = document.getElementById('modal-title-input').value.trim();
    const newDesc = document.getElementById('modal-desc-input').value.trim();

    if (!newTitle) {
      alert("업무 제목은 필수입니다.");
      return;
    }

    const task = tasks.find(t => t.id === currentEditingId);
    if (task) {
      task.text = newTitle;
      task.description = newDesc;
      saveTasksToStorage();
      renderTasks();
    }
    closeEditModal();
  }
  // ------------------------------

  function setFilter(filterType) {
    currentFilter = filterType;
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    
    if(filterType === 'all') buttons[0].classList.add('active');
    if(filterType === 'active') buttons[1].classList.add('active');
    if(filterType === 'completed') buttons[2].classList.add('active');
    
    renderTasks();
  }

  function dragStart(event, id) {
    draggedTaskId = id;
    setTimeout(() => event.target.classList.add('dragging'), 0);
  }

  function dragEnd(event) {
    event.target.classList.remove('dragging');
  }

  function allowDrop(event) {
    event.preventDefault();
  }

  function drop(event, targetType) {
    event.preventDefault();
    const task = tasks.find(t => t.id === draggedTaskId);
    if (task && task.type !== targetType) {
      task.type = targetType;
      saveTasksToStorage(); 
      renderTasks();
    }
  }

  function renderTasks() {
    const majorListEl = document.getElementById('major-list');
    const dailyListEl = document.getElementById('daily-list');
    
    majorListEl.innerHTML = '';
    dailyListEl.innerHTML = '';

    let majorCount = 0; let dailyCount = 0; let completedCount = 0;

    tasks.forEach(task => {
      if (selectedDate && task.rawDate !== selectedDate) return;
      if (task.isCompleted) completedCount++;
      if (currentFilter === 'active' && task.isCompleted) return;
      if (currentFilter === 'completed' && !task.isCompleted) return;
      if (task.type === 'major') majorCount++;
      if (task.type === 'daily') dailyCount++;

      // 💡 부가 설명이 있으면 보여주고, 없으면 안 보여주는 처리
      const descHTML = task.description 
        ? `<p class="task-desc ${task.isCompleted ? 'completed' : ''}">${task.description}</p>` 
        : '';

      const taskHTML = `
        <div class="task-item" data-id="${task.id}" draggable="true" ondragstart="dragStart(event, ${task.id})" ondragend="dragEnd(event)">
          <div class="task-left">
            <div class="task-checkbox ${task.isCompleted ? 'checked' : ''}" onclick="toggleTask(${task.id})">
              ${task.isCompleted ? '✔' : ''}
            </div>
            <div class="task-content">
              <h3 class="${task.isCompleted ? 'completed' : ''}">${task.text}</h3>
              ${descHTML}
              <p class="task-date">📅 ${task.date}</p>
            </div>
          </div>
          <div class="task-actions">
            <button class="task-badge edit-btn" onclick="openEditModal(${task.id})">수정</button>
            <button class="task-badge delete-btn" onclick="deleteTask(${task.id})">삭제</button>
          </div>
        </div>
      `;

      if (task.type === 'major') majorListEl.innerHTML += taskHTML;
      else dailyListEl.innerHTML += taskHTML;
    });

    if (majorListEl.innerHTML === '') majorListEl.innerHTML = '<div class="empty-msg">해당 날짜에 등록된 업무가 없습니다.</div>';
    if (dailyListEl.innerHTML === '') dailyListEl.innerHTML = '<div class="empty-msg">해당 날짜에 등록된 업무가 없습니다.</div>';

    document.getElementById('major-count').innerText = majorCount;
    document.getElementById('daily-count').innerText = dailyCount;
    document.getElementById('top-completed').innerText = completedCount;
    document.getElementById('top-active').innerText = (majorCount + dailyCount) - completedCount;
  }

  // 바탕화면(모달 바깥) 클릭 시 팝업 닫기
  window.onclick = function(event) {
    const modal = document.getElementById('edit-modal');
    if (event.target === modal) {
      closeEditModal();
    }
  }

  renderTasks();
</script>

</body>
</html>
